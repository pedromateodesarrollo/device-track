# Vhost nginx para TU-DOMINIO → hub de device-track (127.0.0.1:3140).
#
# Instalar:
#   sudo cp nginx-hub.conf /etc/nginx/sites-available/TU-DOMINIO
#   sudo sed -i 's/TU-DOMINIO/equipos.ejemplo.com/g' /etc/nginx/sites-available/TU-DOMINIO
#   sudo ln -s /etc/nginx/sites-available/TU-DOMINIO /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d TU-DOMINIO
#
# Requisito previo: DNS A de TU-DOMINIO → IP del servidor.

map $http_upgrade $connection_upgrade_dt {
    default upgrade;
    ''      close;
}

# El alta es pública (trae su código) y es lo que alguien probaría a lo
# bruto: freno aquí, antes del hub, que además lleva el suyo por IP. Un equipo
# reporta cada diez minutos; 10/s por IP con ráfaga deja pasar a un almacén
# entero detrás de la misma IP.
limit_req_zone $binary_remote_addr zone=dt_publico:10m rate=10r/s;
limit_conn_zone $binary_remote_addr zone=dt_conexiones:10m;

server {
    server_name TU-DOMINIO;

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Los equipos viven colgados del WebSocket. Sin esto, nginx los corta cada
    # minuto y reconectan sin parar.
    location = /v1/ws {
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade_dt;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        limit_conn dt_conexiones 500;
        proxy_pass http://127.0.0.1:3140;
    }

    location / {
        limit_req zone=dt_publico burst=60 nodelay;
        # Un lote de reportes atrasados con la lista de apps.
        client_max_body_size 2m;
        proxy_pass http://127.0.0.1:3140;
    }

    listen 80;
    listen [::]:80;
}
